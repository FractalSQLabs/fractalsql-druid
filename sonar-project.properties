# sonar-project.properties: fractalsql-druid.
sonar.projectKey=druid_fractalsql
sonar.projectName=fractalsql-druid

# Demo SQL prompts are multi-line string literals (valid SQL).
sonar.issue.ignore.multicriteria=e19
sonar.issue.ignore.multicriteria.e19.ruleKey=plsql:LiteralsNonPrintableCharactersCheck
sonar.issue.ignore.multicriteria.e19.resourceKey=demo/*.sql

# mcp/vendor/ is vendored third-party source (nlohmann::json), and include/
# holds the vendored core drops: not ours to fix findings in.
sonar.exclusions=**/dist/**, **/build/**, **/target/**, **/node_modules/**, mcp/vendor/**, include/**

sonar.tests=tests,mcp/tests,service/tests
