druid.service=druid/middleManager
druid.plaintextPort=8091

# Number of tasks per middleManager.
#
# An MSQ task -- the only way a value reaches a Druid datasource, and
# therefore every @fixture and every REPLACE INTO in the demo kits --
# occupies TWO of these slots: one for the controller peon and one for
# the worker peon that actually reads the segments. The stock
# micro-quickstart capacity of 2 therefore allows exactly one MSQ task
# at a time, and two tasks started together deadlock: each takes a
# controller slot and neither can find a worker slot to free.
#
# 8 slots is four concurrent MSQ tasks, which is enough to run the
# demo kits in parallel and still leaves headroom.
druid.worker.capacity=8
druid.worker.baseTaskDirs=[\"var/druid/task\"]

# Task launch parameters
druid.indexer.runner.javaOptsArray=["-server","-Xms1g","-Xmx1g","-XX:MaxDirectMemorySize=1g","-Duser.timezone=UTC","-Dfile.encoding=UTF-8","-XX:+ExitOnOutOfMemoryError","-Djava.util.logging.manager=org.apache.logging.log4j.jul.LogManager"]

# HTTP server threads
druid.server.http.numThreads=12

# Processing threads and buffers on Peons
druid.indexer.fork.property.druid.processing.numMergeBuffers=2
druid.indexer.fork.property.druid.processing.buffer.sizeBytes=100MiB
druid.indexer.fork.property.druid.processing.numThreads=1
