# Extensions specified in the load list will be loaded by Druid
# We are using local fs for deep storage - not recommended for production - use S3, HDFS, or NFS instead
# We are using local derby for the metadata store - not recommended for production - use MySQL or Postgres instead

# If you specify `druid.extensions.loadList=[]`, Druid won't load any extension from file system.
# If you don't specify `druid.extensions.loadList`, Druid will load all the extensions under root extension directory.
# More info: https://druid.apache.org/docs/latest/operations/including-extensions.html
druid.extensions.loadList=["druid-hdfs-storage", "druid-kafka-indexing-service", "druid-datasketches", "druid-parquet-extensions", "fractalsql-druid"]

#
# Hostname
#
# druid.host is deliberately unset here. Druid's own launcher (druid.sh)
# sets a per-service druid.host on each service's runtime.properties; a
# shared value of "localhost" here makes every node advertise itself
# as localhost, so peers resolve the coordinator to their own host and
# the broker fails with "Service [coordinator] is not available".
#druid.host=localhost

#
# Logging
#

# Log all runtime properties on startup. Disable to avoid logging properties on startup:
druid.startup.logging.logProperties=true

#
# Zookeeper
#

# ZooKeeper runs in its own container, so the services have to reach it
# by service name; "localhost" points each node at itself.
druid.zk.service.host=zookeeper
druid.zk.paths.base=/druid

#
# Metadata storage
#

# For Derby server on your Druid Coordinator (only viable in a cluster with a single Coordinator, no fail-over):
druid.metadata.storage.type=derby
druid.metadata.storage.connector.connectURI=jdbc:derby://localhost:1527/var/druid/metadata.db;create=true
druid.metadata.storage.connector.host=localhost
druid.metadata.storage.connector.port=1527

# For MySQL (make sure to include the MySQL JDBC driver on the classpath):
#druid.metadata.storage.type=mysql
#druid.metadata.storage.connector.connectURI=jdbc:mysql://db.example.com:3306/druid
#druid.metadata.storage.connector.user=...
#druid.metadata.storage.connector.password=...

# For PostgreSQL:
#druid.metadata.storage.type=postgresql
#druid.metadata.storage.connector.connectURI=jdbc:postgresql://db.example.com:5432/druid
#druid.metadata.storage.connector.user=...
#druid.metadata.storage.connector.password=...

#
# Deep storage
#

# For local disk (only viable in a cluster if this is a network mount):
druid.storage.type=local
druid.storage.storageDirectory=var/druid/segments

# For HDFS:
#druid.storage.type=hdfs
#druid.storage.storageDirectory=/druid/segments

# For S3:
#druid.storage.type=s3
#druid.storage.bucket=your-bucket
#druid.storage.baseKey=druid/segments
#druid.s3.accessKey=...
#druid.s3.secretKey=...

#
# Indexing service logs
#

# For local disk (only viable in a cluster if this is a network mount):
druid.indexer.logs.type=file
druid.indexer.logs.directory=var/druid/indexing-logs

# For HDFS:
#druid.indexer.logs.type=hdfs
#druid.indexer.logs.directory=/druid/indexing-logs

# For S3:
#druid.indexer.logs.type=s3
#druid.indexer.logs.s3Bucket=your-bucket
#druid.indexer.logs.s3Prefix=druid/indexing-logs

#
# Service discovery
#

druid.selectors.indexing.serviceName=druid/overlord
druid.selectors.coordinator.serviceName=druid/coordinator

#
# Monitoring
#

druid.monitoring.monitors=["org.apache.druid.java.util.metrics.JvmMonitor", "org.apache.druid.server.metrics.ServiceStatusMonitor"]
druid.emitter=noop
druid.emitter.logging.logLevel=info

# Storage type of double columns
# ommiting this will lead to index double as float at the storage layer

druid.indexing.doubleStorage=double

#
# Security
#
druid.server.hiddenProperties=["druid.s3.accessKey","druid.s3.secretKey","druid.metadata.storage.connector.password", "password", "key", "token", "pwd"]


#
# SQL
#
druid.sql.enable=true

# Planning SQL query when there is aggregate distinct in the statement
druid.sql.planner.useGroupingSetForExactDistinct=true

#
# Lookups
#
druid.lookup.enableLookupSyncOnStartup=false

# FractalSQL extension settings. See docs/druid-integration.md.
#
# These are operator keys: a request's query context cannot change them,
# because the query context is caller-supplied. The SFS budget below
# decides how much work a search may spend, so it is the operator's.
druid.fractalsql.search.max_generation=17
druid.fractalsql.search.population_size=50
druid.fractalsql.search.maximum_diffusion=2
druid.fractalsql.search.walk=0.5
druid.fractalsql.search.bound_clipping=true

# The daemon: reasoning, embedding and the enterprise tier.
#
# The model provider, its credentials, the models, the THINK settings and
# the enterprise library and ledger are configured in fractalsqld, which
# runs on the same host as the processes that call it. These keys only say how to reach it. They
# are operator keys: a request's query context cannot change them.
druid.fractalsql.daemon_socket=/run/fractalsql/fractalsqld.sock
druid.fractalsql.daemon_hmac_key_file=/run/fractalsql/hmac.key

# Demo only: the enterprise ledger demos reset and compact the ledger, and those operations are off by default. A production
# node leaves this unset (see docs/enterprise.md).
druid.fractalsql.ledger.allow_destructive=true
# A cold model load is slow; the provider needs room.
druid.fractalsql.daemon_timeout_ms=300000
# Latches the ledger's destructive operations on this node.
druid.fractalsql.ledger.read_only=false

# Where the coordinator is reachable.
#
# The extension's own writes are MSQ tasks, and an MSQ task belongs to
# the OVERLORD. Any node can submit one -- the broker forwards the
# submission -- but only the coordinator serves the task's status, so
# the extension has to read it from there. Without this the write
# succeeds and then appears to hang: the poll looks for the task on
# the node that submitted it, which answers 404 for a task it does not
# own, and the write times out ten minutes later having succeeded.
#
# In a single-process deployment the node's own port is right and this
# can stay empty.
druid.fractalsql.coordinator_url=http://coordinator-overlord:8081
